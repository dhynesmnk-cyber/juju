[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "juju"
version = "0.1.0"
description = "What a $10 bet placed 45 minutes before kickoff would have paid (see docs/GOALS.md)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]
# A throwaway local Postgres without Docker: python scripts/dev_postgres.py
localdb = [
    "pgserver>=0.1.4",
]

[tool.setuptools.packages.find]
include = ["juju*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs a PostgreSQL database (TEST_DATABASE_URL)",
]
